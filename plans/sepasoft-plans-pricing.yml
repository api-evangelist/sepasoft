description: >-
  Sepasoft publishes list prices openly on two pricing pages. Licensing is per-module and
  per-server or per-physical-production-site, not per API call - there is no metered API
  plan, no request quota and no free developer tier, because Sepasoft sells Ignition
  modules that run on the customer's own gateway rather than a hosted API. The 2026-05-04
  scaffold that previously occupied this file (invented Free/Pro tiers with request quotas)
  has been replaced with the provider's published numbers.
currency: USD
billing_note: >-
  MES module licences are published as one-time list prices per server or per site; support
  plans are an annual percentage uplift. SepaIQ is published as an annual subscription.
  All prices are provider-stated estimates excluding taxes and fees.
