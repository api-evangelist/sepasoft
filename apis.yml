aid: sepasoft
name: Sepasoft
description: >-
  Sepasoft builds Manufacturing Execution System (MES) software delivered as modules for
  the Inductive Automation Ignition platform, used to control, track and document the
  transformation of raw materials into finished goods in real time. The suite spans OEE and
  downtime tracking, track and trace, ISA-88 batch procedure control, statistical process
  control, settings and changeover, document management, and ERP integration through the
  Business Connector (B2MML / ISA-95) and an SAP interface, alongside SepaIQ for analytics,
  machine learning and LLM features. Its integration surface is the Web Services module,
  which turns a customer's own Ignition Gateway into a REST and SOAP provider and consumer
  rather than a hosted API Sepasoft operates.
