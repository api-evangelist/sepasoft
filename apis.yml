apis:
  - aid: sepasoft:sepasoft
    name: Sepasoft Web Services
    description: >-
      The REST and SOAP surface the Sepasoft Web Services module exposes. Endpoints are
      authored by the operator in the Ignition Designer and served from the customer's own
      Ignition Gateway, mounted beneath /main/system/ws/rest and /main/system/ws/soap, so
      the host and port are deployment-specific. GET, POST, PUT and DELETE are supported
      with JSON or XML responses; provider-side authentication is HTTP Basic against an
      Ignition User Source with optional role constraints. Sepasoft publishes no
      machine-readable contract for this surface - the SOAP WSDL is generated at runtime,
      per endpoint, on the customer's gateway.
    humanURL: https://docs.sepasoft.com/articles/user-manual/web-services
    baseURL: https://{ignition-gateway-host}:{port}/main/system/ws/rest
    tags:
      - Web Services
      - REST
      - SOAP
      - Manufacturing
      - MES
